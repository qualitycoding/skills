# Template: mutation testing in CI as three tiers. Placeholders in <angle brackets>.
# Status: parsed as YAML only. It has not been run as written; the pieces were each run in the
# guitar-amp-vst project (2026-11) but not assembled in this form. Run it once on a throwaway branch
# and read the produced numbers before relying on it.
#
# Tier 1: pull requests and pushes that touch mutable code -> incremental mutation run (changed files).
# Tier 2: schedule -> full run on the default branch.
# Tier 3: workflow_dispatch -> full run on demand.
# The `mutation-gate` job is the ONLY required status check; it fails if a needed run did not pass.

name: mutation

# No `paths:` filter on pull_request/push: a path-filtered workflow does not run at all when no listed
# file changed, so a REQUIRED status check from it stays "pending" forever. The scope step below
# decides "not applicable" and the always-running gate job reports it.
on:
  pull_request:
  push:
    branches: [<default-branch>]
  schedule:
    - cron: '17 3 * * *'            # full run on the default branch (UTC)
  workflow_dispatch:
    inputs:
      scope:
        description: 'full or incremental'
        default: 'full'

permissions:
  contents: read
  issues: write                     # only used by the scheduled-failure step below

jobs:
  mutation:
    runs-on: ubuntu-24.04
    timeout-minutes: <runtime-budget-minutes>       # from the plan; measured, not guessed
    outputs:
      mode: ${{ steps.scope.outputs.mode }}
    steps:
      - uses: actions/checkout@<pinned-sha>
        with: { fetch-depth: 0, submodules: recursive }

      - name: Decide scope (full or incremental)
        id: scope
        shell: bash
        run: |
          set -o pipefail
          if [ "${{ github.event_name }}" != "schedule" ] && { [ "${{ github.event_name }}" != "workflow_dispatch" ] || [ "${{ inputs.scope }}" = "incremental" ]; }; then
            base="${{ github.event.pull_request.base.sha || github.event.before || github.event.repository.default_branch }}"
            if git diff --name-only "$base"...HEAD | python3 <skill-path>/scripts/mull_include_paths.py \
                 --scope '<src-dir-1>/' --scope '<src-dir-2>/' --base mull.yml --out mull.run.yml; then
              echo "mode=incremental" >> "$GITHUB_OUTPUT"
            else
              echo "mode=not-applicable" >> "$GITHUB_OUTPUT"      # reported by the gate, never a silent pass
            fi
          else
            cp mull.yml mull.run.yml
            echo "mode=full" >> "$GITHUB_OUTPUT"
          fi

      - name: Build instrumented tests and run Mull
        if: steps.scope.outputs.mode != 'not-applicable'
        shell: bash
        run: |
          set -o pipefail
          cp mull.run.yml mull.yml                       # Mull reads mull.yml from the working tree
          <build commands with the Mull plugin flags, verified against the pinned tool version>
          mull-runner-<N> --report-name mull --reporters SQLite --reporters IDE \
              --workers <cores> --timeout <ms> --minimum-timeout <ms> --allow-surviving \
              <test-executable> <fast-test-subset> 2>&1 | tee mull.log

      - name: Score gate
        if: steps.scope.outputs.mode != 'not-applicable'
        shell: bash
        run: python3 <skill-path>/scripts/mull_score.py mull.sqlite --floor <floor> --min-mutants <minimum> | tee score.txt

      - name: Upload report
        if: always() && steps.scope.outputs.mode != 'not-applicable'
        uses: actions/upload-artifact@<pinned-sha>
        with: { name: mull-report, path: 'mull.sqlite\nmull.log\nscore.txt', if-no-files-found: error }

      - name: Open an issue when the scheduled run fails
        if: failure() && github.event_name == 'schedule'
        env: { GH_TOKEN: '${{ github.token }}' }
        run: gh issue create --title "Nightly mutation run failed" --body "See ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  mutation-gate:
    # The required status check. Always runs; fails unless the mutation job passed or was
    # legitimately not applicable (no mutable files changed).
    if: always()
    needs: [mutation]
    runs-on: ubuntu-24.04
    steps:
      - shell: bash
        run: |
          result="${{ needs.mutation.result }}"
          mode="${{ needs.mutation.outputs.mode }}"
          echo "mutation job result: $result, mode: $mode"
          [ "$mode" = "not-applicable" ] && echo "No mutable source files changed: mutation testing not applicable to this change."
          [ "$result" = "success" ]
